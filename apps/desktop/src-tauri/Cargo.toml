[package]
name = "zotero-bridge"
description = "Zotero Bridge desktop tray app (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
rfd = "0.15"
zotero-bridge-core = { path = "../../../crates/core" }
zotero-bridge-zotero-api = { path = "../../../crates/zotero-api" }
zotero-bridge-index = { path = "../../../crates/index" }
zotero-bridge-sync = { path = "../../../crates/sync" }
zotero-bridge-mirror = { path = "../../../crates/mirror" }
zotero-bridge-launcher = { path = "../../../crates/launcher" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
