[package]
name = "zotero-bridge-desktop"
description = "Zotero Bridge desktop tray app (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
zsb-core = { path = "../../../crates/core" }
zsb-zotero-api = { path = "../../../crates/zotero-api" }
zsb-index = { path = "../../../crates/index" }
zsb-sync = { path = "../../../crates/sync" }
zsb-mirror = { path = "../../../crates/mirror" }
zsb-launcher = { path = "../../../crates/launcher" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
