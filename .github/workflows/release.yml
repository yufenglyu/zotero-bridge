name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build portable package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\release-windows.ps1

      - name: Build Windows installers
        working-directory: apps/desktop
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis,msi --no-sign --ci

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          Get-ChildItem -Path "target/dist" -File -Filter "*.zip" |
            ForEach-Object { Copy-Item $_.FullName "release-assets/$($_.Name)" -Force }

          $bundleRoot = "target/x86_64-pc-windows-msvc/release/bundle"
          $nsis = Get-ChildItem -Path "$bundleRoot/nsis" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi = Get-ChildItem -Path "$bundleRoot/msi" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) { throw "Windows NSIS installer not found." }
          if ($null -eq $msi) { throw "Windows MSI installer not found." }

          Copy-Item $nsis.FullName "release-assets/zotero-bridge-v${version}-windows-x64-setup.exe" -Force
          Copy-Item $msi.FullName "release-assets/zotero-bridge-v${version}-windows-x64.msi" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS universal
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build macOS app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release-macos.sh --sign

      - name: Prepare macOS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp target/dist/zotero-bridge-v*-macos-universal-app.zip release-assets/
          cp target/dist/zotero-bridge-v*-macos-universal.dmg release-assets/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Prepare release notes
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG_PATH="CHANGELOG.md"
          [ -f "$CHANGELOG_PATH" ] || { echo "Changelog file not found: $CHANGELOG_PATH" >&2; exit 1; }
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { capture = 1; print; next }
            capture && /^## / { exit }
            capture { print }
          ' "$CHANGELOG_PATH" > release-body.md
          [ -s release-body.md ] || { echo "Changelog section not found for version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Zotero Bridge v${{ steps.release_meta.outputs.version }}
          body_path: release-body.md
          files: release-assets/*
