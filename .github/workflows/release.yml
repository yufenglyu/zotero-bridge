name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-cli:
    name: CLI binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: zsb.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: zsb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build zsb CLI
        run: cargo build --release -p zsb
      - name: package
        shell: bash
        run: |
          mkdir -p artifacts
          cp "target/release/${{ matrix.bin }}" artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: zsb-cli-${{ matrix.target }}
          path: artifacts/

  build-desktop:
    name: Desktop installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: install frontend deps
        working-directory: apps/desktop
        run: npm ci

      # Windows code signing (optional): set TAURI_SIGNING_PRIVATE_KEY and
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets for Azure Trusted Signing,
      # or sign the .exe/.msi in a follow-up step with signtool + a PFX
      # stored in secrets. See docs/release.md.
      #
      # macOS signing + notarization (optional): provide these secrets —
      #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
      #   APPLE_SIGNING_IDENTITY
      #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      # See docs/release.md.
      - name: tauri build
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build

      - name: upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: zsb-desktop-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn

  draft-release:
    name: draft GitHub release
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download@v4
        with:
          path: artifacts
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
