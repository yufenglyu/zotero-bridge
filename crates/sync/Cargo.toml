[package]
name = "zotero-bridge-sync"
description = "Incremental sync engine from Zotero Local API to the local index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zotero-bridge-core = { path = "../core" }
zotero-bridge-zotero-api = { path = "../zotero-api" }
zotero-bridge-index = { path = "../index" }
zotero-bridge-mirror = { path = "../mirror" }
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
